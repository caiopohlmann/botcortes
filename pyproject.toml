[project]
name = "cortes"
version = "0.1.0"
description = "Detecta momentos de hype em lives (Twitch, Kick, YouTube) e gera cortes verticais legendados."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=14.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "numpy>=1.26",
    "streamlink>=7.0",
    "faster-whisper>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "psutil>=6.0",
    "colorama>=0.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
# DLLs do CUDA 12 / cuDNN 9 usadas pelo CTranslate2 (faster-whisper) na GPU.
# Evita instalar o CUDA Toolkit inteiro no Windows.
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
cortes = "cortes.entrypoints.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português com acentos/aspas

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cortes"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "streamlink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
